image: node:16-bullseye

cache:
  key: $CI_COMMIT_REF_SLUG
  paths:
    - node_modules/

build:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - "build/"
    untracked: false
    when: on_success
    expire_in: 30 days

test:
  stage: test
  script:
    - npm test -- --watchAll=false