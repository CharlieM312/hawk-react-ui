
name: CI

on:
    push:

permissions:
    contents: read
    pull-requests: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js 25
              uses: actions/setup-node@v6
              with:
                  node-version: '25'
                  cache: 'npm'
            - name: Install dependencies
              run: |
                npm ci
            - name: Build
              run: |
                npm run build
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js 25
              uses: actions/setup-node@v6
              with:
                  node-version: '25'
                  cache: 'npm'
            - name: Install dependencies
              run: |
                npm ci
            - name: Test
              run: |
                npm run test
            - name: Upload test results
              uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: test-results
                  path: ./test-results
            - name: Test Summary    
              uses: test-summary/action@v2
              if: always()
              with:
                paths: ./test-results/results.xml