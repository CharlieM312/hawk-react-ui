
name: push image

on:
    push:
     branches:
        - main
    
    workflow_dispatch:
        inputs:
            tag:
                description: 'Tag to push (e.g., 1.0.0)'
                required: true
                default: 'latest'

permissions:
    contents: write

jobs:
    docker:
        runs-on: ubuntu-latest
        steps:
            -
                name: Login to GHCR
                uses: docker/login-action@v4
                with:
                    registry: ghcr.io
                    username: ${{ vars.DOCKER_USERNAME }}
                    password: ${{ secrets.DOCKER_PASSWORD }}
            -
                name: Set up QEMU
                uses: docker/setup-qemu-action@v4
            -
                name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v4
            -
                name: Build and push
                uses: docker/build-push-action@v7
                with:
                    push: true
                    tags: |
                        ghcr.io/charliem312/hawk-react-ui:${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || 'latest' }}
                    labels: |
                        org.opencontainers.image.source=${{ github.repositoryUrl }}
                        org.opencontainers.image.description="A React UI for managing Hawk instances"
                    annotations: |
                        index:org.opencontainers.image.description=A React UI for managing Hawk instances
                        index:org.opencontainers.image.source=${{ github.repositoryUrl }}
                    platforms: linux/amd64,linux/arm64
                    cache-from: type=gha
                    cache-to: type=gha,mode=max
            -   name: Checkout Repository
                if: github.event_name == 'workflow_dispatch'
                uses: actions/checkout@v6
            -
                name: Create a Tag
                if: github.event_name == 'workflow_dispatch'
                run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git tag ${{ github.event.inputs.tag }}
                    git push origin ${{ github.event.inputs.tag }}
            -   
                name: Create GitHub Release
                if: github.event_name == 'workflow_dispatch'
                uses: softprops/action-gh-release@v2
                with:
                    tag_name: ${{ github.event.inputs.tag }}
                    name: Release ${{ github.event.inputs.tag }}
                    generate_release_notes: true
                    draft: false
                    prerelease: false
            