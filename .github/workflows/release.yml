
name: push image

on:
    push:
     branches:
        - main
    
    workflow_dispatch:
        inputs:
            tag:
                description: 'Tag to push (e.g., 1.0.0)'
                required: true
                default: 'latest'

jobs:
    docker:
        runs-on: ubuntu-latest
        steps:
            -
                name: Login to GHCR
                uses: docker/login-action@v3
                with:
                    registry: ghcr.io
                    username: ${{ vars.DOCKER_USERNAME }}
                    password: ${{ secrets.DOCKER_PASSWORD }}
            -
                name: Set up QEMU
                uses: docker/setup-qemu-action@v3
            -
                name: Set up Docker Buildx
                uses: docker/setup-buildx-action@v3
            -
                name: Build and push
                uses: docker/build-push-action@v6
                with:
                    push: true
                    tags: |
                        ghcr.io/charliem312/hawk-react-ui:${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || 'latest' }}
                    labels: |
                        org.opencontainers.image.source=${{ github.repositoryUrl }}
                        org.opencontainers.image.description="A React UI for managing Hawk instances"
